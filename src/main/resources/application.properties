
spring.application.name=finance-suite

# Servidor
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/finance_suite
spring.datasource.username=finance_user
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration



# Supabase Auth
supabase.auth.url=${SUPABASE_URL}

# JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=${supabase.auth.url}/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${supabase.auth.url}/auth/v1/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256
spring.security.oauth2.resourceserver.jwt.audiences[0]=authenticated

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG