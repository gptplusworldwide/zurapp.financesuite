
services:
  postgres:
    image: postgres:17
    container_name: finance-suite-postgres
    restart: unless-stopped

    ports:
      - "127.0.0.1:5433:5432"

    environment:
      POSTGRES_DB: finance_suite
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user -d finance_suite"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
